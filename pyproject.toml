[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-zero-cortex"
version = "0.1.0"
description = "Agent Zero plugin for Cortex memory backend"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "dirtyjson>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: real-Cortex tests, run with -m integration"]
addopts = "-m 'not integration'"

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_plugin"]
